<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas Lu 呂建興｜電子名片</title>

<!-- ===================================================================
     永久入口轉址層 (permanent entry redirect)

     NFC 標籤與所有對外 QR Code 一律寫這一頁的網址，永不變更。
     要更換名片網站時，只需修改下方 TARGET 一行，其餘一切自動生效。

     目前目標站台：cardseats.com（自有網域，Cloudflare Pages 專案 e-card，2026-10-13 起）
     前一代：e-card-dlf.pages.dev（施工架網址，仍可開啟但不對外公佈）
     再前一代：本 repo 的 card/（仍然存在、仍可直接開，留作備援，不再是入口目標）
     更前一代：ChatGPT Sites（已停用，發布管道不再可用）

     ⚠ 這一頁的網址（https://lucaslu916-coder.github.io/）才是印在 NFC 貼紙與
       紙本 QR 上的那個，永遠不要改。要換名片站台只改下面四處目標網址。
     維護手冊：Notion「🪪 NFC／QR 電子名片專案｜製作流程與維護手冊」
     =================================================================== -->

<link rel="canonical" href="https://cardseats.com/itri-isti/lucas/">
<meta http-equiv="refresh" content="0; url=https://cardseats.com/itri-isti/lucas/">

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f6f8fa;
    color: #1f2933;
  }
  main { text-align: center; max-width: 22rem; }
  .name { font-size: 1.25rem; font-weight: 700; letter-spacing: .01em; }
  .role { margin-top: .35rem; font-size: .9rem; color: #5b6b7c; }
  .msg  { margin-top: 1.5rem; font-size: .9rem; color: #5b6b7c; line-height: 1.6; }
  .btn {
    display: inline-block;
    margin-top: 1.1rem;
    padding: .7rem 1.4rem;
    border-radius: 999px;
    background: #00539f;
    color: #fff;
    font-size: .95rem;
    font-weight: 600;
    text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #11161c; color: #e6edf3; }
    .role, .msg { color: #9aa7b4; }
    .btn { background: #3b8fd8; color: #06121f; }
  }
</style>
</head>
<body>
<main>
  <p class="name">呂建興　Lucas Lu</p>
  <p class="role">資深研究員　Senior Researcher<br>工研院產科國際所　ITRI ISTI</p>
  <p class="msg">正在開啟電子名片…<br><span lang="en">Opening digital business card…</span></p>
  <a class="btn" id="go" href="https://cardseats.com/itri-isti/lucas/">
    手動開啟　Open manually
  </a>
</main>

<script>
  // 目標網址：更換名片站台時只需改這一行
  var TARGET = "https://cardseats.com/itri-isti/lucas/";

  // 保留查詢字串與錨點，方便日後做來源追蹤（例如 ?src=nfc）
  var target = TARGET + location.search + location.hash;

  document.getElementById("go").href = target;

  // replace 不留下歷史紀錄，使用者按上一頁不會被彈回來
  location.replace(target);
</script>
</body>
</html>
